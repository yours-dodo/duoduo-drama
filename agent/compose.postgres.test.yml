services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: duoduo_agent_test
      POSTGRES_USER: duoduo_agent
      POSTGRES_PASSWORD: duoduo_agent_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duoduo_agent -d duoduo_agent_test']
      interval: 1s
      timeout: 3s
      retries: 30
