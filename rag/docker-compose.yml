name: duoduo-rag

services:
  etcd:
    image: ${MILVUS_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.25}
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: ${MILVUS_MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:-minioadmin}
    command: ['minio', 'server', '/minio_data', '--console-address', ':9001']
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v3.0.0}
    restart: unless-stopped
    command: ['milvus', 'run', 'standalone']
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_PASSWORD:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - '127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530'
      - '127.0.0.1:${MILVUS_WEBUI_HOST_PORT:-9091}:9091'
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  etcd-data:
  minio-data:
  milvus-data:
