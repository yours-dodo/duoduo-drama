services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: duoduo_server_test
      POSTGRES_USER: duoduo_server
      POSTGRES_PASSWORD: duoduo_server_test
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duoduo_server -d duoduo_server_test']
      interval: 1s
      timeout: 3s
      retries: 30
