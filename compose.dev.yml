name: duoduo-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-duoduo_server}
      POSTGRES_USER: ${POSTGRES_USER:-duoduo_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./db/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-init:
    image: postgres:18-alpine
    restart: 'no'
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-duoduo_server}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      AGENT_POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:-change-me}
    entrypoint: ['/bin/sh', '/init-databases.sh']
    volumes:
      - ./infra/postgres/init-databases.sh:/init-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-duoduo_server}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    command: ['server', '/data', '--console-address', ':9001']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${SERVER_OBJECT_STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-duoduo_server}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me}
      SERVER_OBJECT_STORAGE_BUCKET: ${SERVER_OBJECT_STORAGE_BUCKET:-duoduo-assets}
    depends_on:
      minio:
        condition: service_healthy

  milvus-etcd:
    image: ${MILVUS_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.25}
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 10s
      timeout: 10s
      retries: 12

  milvus-minio:
    image: ${MILVUS_MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:-minioadmin}
    command: ['minio', 'server', '/minio_data', '--console-address', ':9001']
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 10s
      retries: 12

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v3.0.0}
    restart: unless-stopped
    command: ['milvus', 'run', 'standalone']
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_PASSWORD:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - '127.0.0.1:${MILVUS_HOST_PORT:-19530}:19530'
      - '127.0.0.1:${MILVUS_WEBUI_HOST_PORT:-9091}:9091'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 20
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-8.19.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - '127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health']
      interval: 10s
      timeout: 10s
      retries: 30

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.0.0}
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
    ports:
      - '127.0.0.1:${KAFKA_PORT:-29092}:29092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  elasticsearch-data:
  kafka-data:
