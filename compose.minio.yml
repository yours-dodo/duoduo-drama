services:
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: duoduo_server
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - duoduo-minio-data:/data
    command: server /data --console-address ':9001'

volumes:
  duoduo-minio-data:
